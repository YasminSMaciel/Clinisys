<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CliniSys - Convênios</title>

  <link rel="stylesheet" href="../public/css/style.css" />
</head>
<body>

  <div class="sistema">

    <!-- Menu lateral -->
    <aside class="menu-lateral">

      <div class="marca">
        <div class="icone-marca">+</div>
        <div>
          <strong>CliniSys</strong>
          <small>Gestão de Clínica</small>
        </div>
      </div>

      <nav>
        <a href="../index.html">Painel</a>
        <a href="pacientes.html">Pacientes</a>
        <a href="medicos.html">Médicos</a>
        <a href="convenios.html" class="ativo">Convênios</a>
        <a href="consultas.html">Consultas</a>
      </nav>

      <div class="menu-rodape">
        <button id="carregarExemplos">Carregar exemplos</button>
        <button id="limparDados">Limpar dados</button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="conteudo">

      <div class="cabecalho-pagina">
        <h1>Convênios</h1>
        <div class="cabecalho-acoes">
          <input type="text" id="campoBusca" placeholder="Buscar convênios..." />
          <button class="btn btn-primario" id="abrirFormulario">+ Novo Convênio</button>
        </div>
      </div>

      <div class="cartao">
        <div class="cartao-cabecalho">
          Convênios <span class="contador" id="quantidade">0</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Registro ANS</th>
              <th>Telefone</th>
              <th>Pacientes</th>
              <th>Situação</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="listaConvenios"></tbody>
        </table>

        <div class="mensagem-vazia oculto" id="mensagemVazia">
          Nenhum convênio cadastrado. Clique em "Carregar exemplos" ou em "+ Novo Convênio".
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de cadastro / edição -->
  <div class="fundo-modal oculto" id="sobreposicao">
    <div class="modal">
      <div class="modal-cabecalho">
        <h2 id="tituloModal">Novo Convênio</h2>
        <button id="fecharFormulario">✕</button>
      </div>

      <form id="formConvenio">
        <input type="hidden" id="convenioId" />

        <div class="grade-formulario">
          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" placeholder="Nome do convênio" required />
          </div>

          <div class="campo">
            <label for="registroAns">Registro ANS *</label>
            <input type="text" id="registroAns" placeholder="Só números" required />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="0800 000 0000" />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="email@exemplo.com" />
          </div>

          <div class="campo largura-total">
            <label for="situacao">Situação *</label>
            <select id="situacao" required>
              <option value="Ativo">Ativo</option>
              <option value="Inativo">Inativo</option>
            </select>
          </div>
        </div>

        <div class="modal-rodape">
          <button type="button" class="btn btn-secundario" id="cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../public/js/dados.js"></script>
  <script src="../public/js/convenios.js"></script>
</body>
</html>
