<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CliniSys - Pacientes</title>

  <link rel="stylesheet" href="../public/css/style.css" />
</head>
<body>

  <div class="sistema">

    <!-- Menu lateral -->
    <aside class="menu-lateral">

      <div class="marca">
        <div class="icone-marca">+</div>
        <div>
          <strong>CliniSys</strong>
          <small>Gestão de Clínica</small>
        </div>
      </div>

      <nav>
        <a href="../index.html">Painel</a>
        <a href="pacientes.html" class="ativo">Pacientes</a>
        <a href="medicos.html">Médicos</a>
        <a href="convenios.html">Convênios</a>
        <a href="consultas.html">Consultas</a>
      </nav>

      <div class="menu-rodape">
        <button id="carregarExemplos">Carregar exemplos</button>
        <button id="limparDados">Limpar dados</button>
      </div>
    </aside>

    <!-- Conteúdo -->
    <main class="conteudo">

      <div class="cabecalho-pagina">
        <h1>Pacientes</h1>
        <div class="cabecalho-acoes">
          <input type="text" id="campoBusca" placeholder="Buscar pacientes..." />
          <button class="btn btn-primario" id="abrirFormulario">+ Novo Paciente</button>
        </div>
      </div>

      <div class="cartao">
        <div class="cartao-cabecalho">
          Pacientes <span class="contador" id="quantidade">0</span>
        </div>

        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Tipo</th>
              <th>Convênio</th>
              <th>Telefone</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="listaPacientes"></tbody>
        </table>

        <div class="mensagem-vazia oculto" id="mensagemVazia">
          Nenhum paciente cadastrado. Clique em "Carregar exemplos" ou em "+ Novo Paciente".
        </div>
      </div>
    </main>
  </div>

  <!-- Modal de cadastro / edição -->
  <div class="fundo-modal oculto" id="sobreposicao">
    <div class="modal">
      <div class="modal-cabecalho">
        <h2 id="tituloModal">Novo Paciente</h2>
        <button id="fecharFormulario">✕</button>
      </div>

      <form id="formPaciente">
        <input type="hidden" id="pacienteId" />

        <div class="grade-formulario">
          <div class="campo">
            <label for="tipo">Tipo *</label>
            <select id="tipo" required>
              <option value="Convênio">Convênio</option>
              <option value="Particular">Particular</option>
            </select>
          </div>

          <div class="campo">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" placeholder="Nome completo" required />
          </div>

          <div class="campo">
            <label for="nomeMae">Nome da mãe</label>
            <input type="text" id="nomeMae" placeholder="Nome da mãe" />
          </div>

          <div class="campo">
            <label for="sexo">Sexo *</label>
            <select id="sexo" required>
              <option value="Feminino">Feminino</option>
              <option value="Masculino">Masculino</option>
              <option value="Outro">Outro</option>
            </select>
          </div>

          <div class="campo">
            <label for="nascimento">Nascimento</label>
            <input type="date" id="nascimento" />
          </div>

          <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" placeholder="Só números" required />
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" placeholder="(00) 00000-0000" />
          </div>

          <div class="campo">
            <label for="convenio">Convênio</label>
            <select id="convenio"></select>
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="email@exemplo.com" />
          </div>

          <div class="campo">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" placeholder="Rua / Av." />
          </div>

          <div class="campo">
            <label for="numero">Nº</label>
            <input type="text" id="numero" />
          </div>

          <div class="campo">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" />
          </div>

          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" />
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" />
          </div>
        </div>

        <div class="modal-rodape">
          <button type="button" class="btn btn-secundario" id="cancelar">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../public/js/dados.js"></script>
  <script src="../public/js/pacientes.js"></script>
</body>
</html>
